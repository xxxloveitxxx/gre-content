name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main ]  # Deploy when code merges to main
  pull_request:
    branches: [ main ]  # Optional: preview PRs

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'  # Match your local Node version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js static export
        run: npm run build  # Creates /out folder [[19]]
        env:
         NODE_OPTIONS: "--max-old-space-size=4096"
         GENKIT_TELEMETRY_ENABLED: "false"        # ✅ Add this
         OTEL_TRACES_EXPORTER: "none"              # ✅ Add this
         OTEL_METRICS_EXPORTER: "none"             # ✅ Add this
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_GRE_CONTENT }}'
          projectId: content-gre  # ⚠️ REPLACE with your actual Firebase Project ID
          entryPoint: '.'  # Root of repo
        env:
          FIREBASE_PROJECT: content-gre  # ⚠️ REPLACE with your Project ID
